[package]
name = "iroh-proxy-utils"
version = "0.2.0"
edition = "2024"
description = "HTTP and TCP proxy utilities for iroh peer-to-peer connections"
license = "MIT OR Apache-2.0"
repository = "https://github.com/n0-computer/iroh-proxy-utils"
authors = ["n0 team"]
documentation = "https://docs.rs/iroh-proxy-utils"
keywords = ["iroh", "proxy", "http", "quic", "p2p"]
categories = ["network-programming"]
rust-version = "1.85"

[dependencies]
bytes = "1.11.0"
derive_more = { version = "2.1.1", features = ["display"] }
dynosaur = "0.3.0"
http = "1.4.0"
http-body-util = "0.1.3"
httparse = "1.10.1"
hyper = { version = "1.8.1", features = ["full"] }
hyper-util = { version = "0.1.19", features = ["full"] }
iroh = "=1.0.0-rc.0"
iroh-metrics = "=1.0.0-rc.0"
iroh-util = "0.4.0"
n0-error = "=1.0.0-rc.0"
n0-future = "0.3.2"
pin-project = "1.1.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = { version = "0.7.16", features = ["time"] }
tracing = "0.1.41"

[dev-dependencies]
clap = { version = "4.5.54", features = ["derive"] }
fastwebsockets = { version = "0.10", features = ["upgrade"] }
n0-tracing-test = "0.3.0"
tokio-stream = "0.1.18"
tracing-subscriber = "0.3.22"
